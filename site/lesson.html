<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qubit a qubit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
<script src="account.js"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="index.html"><span class="dot"></span>Qubit a qubit</a>
  <div class="crumb"><small id="crumb-part"></small><b id="crumb-title"></b></div>
  <div class="tools">
    <select class="tool" id="speed" aria-label="Velocidad">
      <option value="0.85">0,85×</option><option value="1" selected>1×</option>
      <option value="1.15">1,15×</option><option value="1.3">1,3×</option><option value="1.5">1,5×</option>
    </select>
    <button class="tool on" id="cc" title="Subtítulos (C)">CC</button>
    <button class="tool" id="mute">🔊</button>
    <div data-account></div>
    <div data-theme-ctl></div>
  </div>
</header>

<main class="player">
  <div id="viewport">
    <div id="stage">
      <div id="tag"></div>
      <div id="scene" class="scene"></div>
      <div id="ask"></div>
    </div>
  </div>
  <div id="caption"></div>
  <div class="controls">
    <div class="btns">
      <button class="cbtn" id="prev" aria-label="Paso anterior" title="Paso anterior (←)">⏮</button>
      <button class="cbtn play" id="play" aria-label="Pausa" title="Pausa / reproducir (espacio)">❚❚</button>
      <button class="cbtn" id="replay" aria-label="Repetir paso" title="Repetir este paso">↺</button>
      <button class="cbtn small" id="back5" aria-label="Retroceder 5 segundos" title="−5 s (Mayús + ←)">−5</button>
      <button class="cbtn small" id="fwd5" aria-label="Avanzar 5 segundos" title="+5 s (Mayús + →)">+5</button>
      <button class="cbtn" id="next" aria-label="Paso siguiente" title="Paso siguiente (→)">⏭</button>
    </div>
    <div id="timeline"></div>
  </div>
</main>

<div class="overlay" id="start">
  <div class="card">
    <div class="eyebrow" id="start-eyebrow"></div>
    <h1 id="start-title"></h1>
    <div class="meta" id="start-meta"></div>
    <p>Al terminar esta lección podrás:</p>
    <ul id="start-goals"></ul>
    <div class="actions">
      <button class="cta primary" id="go">Comenzar ▶</button>
      <button class="cta" id="resume" style="display:none"></button>
      <a class="cta" href="index.html">Índice</a>
    </div>
  </div>
</div>

<div class="overlay hide" id="end">
  <div class="card">
    <div class="eyebrow">Lección completada</div>
    <h1 id="end-title"></h1>
    <div class="score" id="end-score"></div>
    <div id="end-practice-wrap">
      <p>Practica y profundiza:</p>
      <ul id="end-practice"></ul>
    </div>
    <div class="actions">
      <a class="cta primary" id="end-next">Siguiente lección →</a>
      <button class="cta" id="again">Repetir</button>
      <a class="cta" href="index.html">Índice</a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="notebooks.js"></script>
<script src="sfx.js"></script>
<script src="blocks.js"></script>
<script src="exercise.js"></script>
<script src="engine.js"></script>
</body>
</html>
