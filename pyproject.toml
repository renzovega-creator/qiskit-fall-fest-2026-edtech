[project]
name = "qiskit-guides-curso"
version = "0.1.0"
description = "Curso interactivo en español sobre las guías de IBM Quantum / Qiskit"
requires-python = ">=3.11"
dependencies = [
  "qiskit[visualization,qasm3-import]>=2.5.2",
  "qiskit-aer~=0.17",
  "qiskit-ibm-runtime>=0.50",
  "qiskit-mitigation~=0.1",
  "qiskit-addon-utils~=0.4.0",
  "matplotlib",
  "pylatexenc",
  "ipython",
  "samplomatic",
  "marimo>=0.25.1",
  "nbformat>=5.11.1",
  "qiskit-addon-obp>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
tools = [
    "edge-tts",
    "playwright",
    "pillow",
]

runner = [
    "qiskit",
    "qiskit-aer",
    "qiskit-ibm-runtime",
]

[tool.uv]
package = false
