[tools]
python = "3.14"
uv = "0.13"

[tasks.fetch]
description = "Download the upstream Qiskit guides into .cache/qiskit-docs if they are missing"
run = "python tools/fetch_docs.py"

[tasks.build]
description = "Rebuild site/lessons/*/lesson.json and site/course.json and check guide coverage"
run = "uv run python lessons_src/build.py"

[tasks.test]
description = "Run practice notebooks with solutions and controls at both bounds, check every exercise, run its tests, then drive the exercise editor and the project panel in a browser"
run = [
  "uv run python tools/practica.py",
  "uv run python tools/exercises.py",
  "uv run pytest tests/exercises_test.py",
  "uv run --group tools python tests/exercise_ui_test.py",
  "uv run --group tools python tests/proyecto_test.py",
]

[tasks.runner]
description = "Build the runner image and test /run over HTTP against it (needs Docker)"
run = "uv run pytest tests/runner_test.py"

[tasks.verify]
description = "Run the Python code shown in every lesson and compare the checked outputs"
run = "uv run python tools/verify.py"

[tasks.check]
description = "Fetch the guides, rebuild the lessons, run the notebooks and the lesson code"
run = [
  { task = "fetch" },
  { task = "build" },
  { task = "test" },
  { task = "verify" },
]
