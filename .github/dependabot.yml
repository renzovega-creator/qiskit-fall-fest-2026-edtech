version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /editor
      - /runner/worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /runner
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
